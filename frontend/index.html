<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stockit - Stock Analysis Platform</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/loading.css">
    
    <style>
        /* Additional responsive styles */
        @media (max-width: 1024px) {
            .grid-cols-3 { grid-template-columns: repeat(2, 1fr); }
            .grid-cols-4 { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 16px;
            }

            header {
                padding: 16px 0;
            }

            .grid-cols-2,
            .grid-cols-3,
            .grid-cols-4 {
                grid-template-columns: 1fr;
            }

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .nav-tabs {
                font-size: 13px;
            }

            .nav-tab {
                padding: 10px 16px;
            }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            h2 { font-size: 1.2rem; }
            
            .stats-row {
                grid-template-columns: 1fr;
            }

            .price-value {
                font-size: 20px;
            }

            .stat-value {
                font-size: 16px;
            }
        }

        /* Main content styling */
        main {
            min-height: calc(100vh - 200px);
            padding: 30px 0;
        }

        .nav-tabs-wrapper {
            background: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
            margin-left: -20px;
            margin-right: -20px;
            padding: 0 20px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tabbed-content {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        footer {
            background: var(--secondary-bg);
            border-top: 1px solid var(--border-color);
            padding: 30px 0;
            margin-top: 60px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <!-- Loading Bar -->
    <div id="loading-bar" class="loading-bar"></div>
    
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-top">
                <div class="header-content">
                    <div class="logo-section">
                        <div class="logo">📊 Stockit</div>
                    </div>
                    <form class="search-form" style="flex: 1; max-width: 400px;">
                        <div class="search-bar">
                            <input 
                                type="text" 
                                id="search-input"
                                placeholder="Search stocks (e.g., TCS, RELIANCE, INFY)"
                                autocomplete="off"
                            />
                        </div>
                    </form>
                    <div class="header-actions">
                        <button class="btn btn-secondary btn-small">⚙️ Settings</button>
                    </div>
                </div>
            </div>
            
            <!-- Company Header -->
            <div id="company-header-container"></div>
        </div>
    </header>
    
    <!-- Navigation Tabs -->
    <div class="nav-tabs-wrapper">
        <div class="container">
            <nav class="nav-tabs">
                <button class="nav-tab active" data-tab="overview">📊 Overview</button>
                <button class="nav-tab" data-tab="chart">📈 Chart</button>
                <button class="nav-tab" data-tab="analysis">💹 Analysis</button>
                <button class="nav-tab" data-tab="financials">💰 Financials</button>
                <button class="nav-tab" data-tab="peers">👥 Peers</button>
                <button class="nav-tab" data-tab="news">📰 News & Sentiment</button>
                <button class="nav-tab" data-tab="documents">📄 Documents</button>
            </nav>
        </div>
    </div>
    
    <!-- Main Content -->
    <main>
        <div class="container">
            <div id="main-content">
                <!-- Tab Contents -->
                <div id="tab-overview" class="tab-content active"></div>
                <div id="tab-chart" class="tab-content"></div>
                <div id="tab-analysis" class="tab-content"></div>
                <div id="tab-financials" class="tab-content"></div>
                <div id="tab-peers" class="tab-content"></div>
                <div id="tab-news" class="tab-content"></div>
                <div id="tab-documents" class="tab-content"></div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 Stockit - Stock Analysis Platform. Built with ❤️</p>
            <p style="margin-top: 8px; font-size: 11px;">Data provided by NSE India | Powered by FinBERT</p>
        </div>
    </footer>
    
    <!-- Scripts (in order of dependency) -->
    <script src="js/loader.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
