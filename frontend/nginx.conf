# Define a cache zone named "api_cache" with 10MB size and 5-minute inactive timeout
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=5m use_temp_path=off;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:10000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Enable proxy caching for this location
    proxy_cache api_cache;
    proxy_cache_valid 200 5m;           # Cache 200 responses for 5 minutes
    proxy_cache_valid 404 1m;           # Cache 404s for 1 minute
    proxy_cache_key "$scheme$request_method$host$request_uri";
    
    # Only cache GET requests
    proxy_cache_methods GET HEAD;
    
    # Add cache status header for debugging
    add_header X-Cache-Status $upstream_cache_status;
  }

  location / {
    try_files $uri /index.html;
  }
}
