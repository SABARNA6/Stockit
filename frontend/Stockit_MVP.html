<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Stockit - Live Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --green: #3fb950;    --green-bg: rgba(63,185,80,0.15);
            --red:   #f85149;    --red-bg:   rgba(248,81,73,0.15);
            --yellow:#d29922;    --yellow-bg: rgba(210,153,34,0.15);
            --blue:  #58a6ff;    --blue-bg:  rgba(88,166,255,0.15);
            --purple:#a371f7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0 20px;
        }

        header h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .search-container {
            max-width: 640px;
            margin: 0 auto 40px;
            display: flex;
            gap: 12px;
        }

        .search-input {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 16px 20px;
            font-size: 1.1rem;
            border-radius: 12px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--blue);
        }

        .search-btn {
            background: var(--blue);
            color: white;
            border: none;
            padding: 0 32px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .search-btn:hover:not(:disabled) { opacity: 0.92; }
        .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .loader {
            border: 4px solid var(--bg-secondary);
            border-top: 4px solid var(--blue);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }
        .error-msg { color: var(--red); text-align: center; margin: 12px 0; font-weight: 500; }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--blue-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(580px, 1fr));
            gap: 24px;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .metric {
            background: var(--bg-tertiary);
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .metric-value { font-size: 1.6rem; font-weight: 700; }
        .metric-label  { font-size: 0.82rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 4px; }

        .positive { color: var(--green); }
        .negative { color: var(--red); }
        .neutral   { color: var(--yellow); }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
        }
        .badge-positive { background: var(--green-bg);  color: var(--green); }
        .badge-negative { background: var(--red-bg);    color: var(--red); }
        .badge-neutral  { background: var(--yellow-bg); color: var(--yellow); }

        .price-chart, .candle-chart {
            position: relative;
            height: 200px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            margin: 16px 0;
            overflow: hidden;
        }

        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 160px;
            gap: 6px;
            padding: 0 8px;
        }

        .bar-wrapper { flex: 1; max-width: 60px; text-align: center; }
        .bar { width: 100%; border-radius: 4px 4px 0 0; min-height: 4px; transition: height 0.4s; }
        .bar-label { font-size: 0.7rem; color: var(--text-secondary); margin-top: 6px; }

        .gauge-container { text-align: center; margin: 24px 0; }
        .gauge {
            position: relative;
            width: 220px;
            height: 110px;
            margin: 0 auto;
            overflow: hidden;
        }
        .gauge-bg {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: conic-gradient(var(--red) 0deg 60deg, var(--yellow) 60deg 120deg, var(--green) 120deg 180deg, transparent 180deg 360deg);
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
        }
        .gauge-center {
            position: absolute;
            width: 150px;
            height: 150px;
            background: var(--bg-tertiary);
            border-radius: 50%;
            top: 35px;
            left: 35px;
        }
        .gauge-needle {
            position: absolute;
            width: 4px;
            height: 70px;
            background: var(--text-primary);
            bottom: 0;
            left: 108px;
            transform-origin: bottom center;
            transition: transform 0.8s ease;
            border-radius: 2px;
        }
        .gauge-value {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.4rem;
            font-weight: 700;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.78rem;
        }

        .outcome-box {
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid;
        }
        .outcome-bullish { border-color: var(--green);  background: var(--green-bg); }
        .outcome-bearish { border-color: var(--red);    background: var(--red-bg); }
        .outcome-sideways { border-color: var(--yellow); background: var(--yellow-bg); }

        .strategy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        .strategy-card {
            background: var(--bg-tertiary);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }

        @media (max-width: 900px) {
            .grid, .strategy-grid { grid-template-columns: 1fr; }
            .search-container { flex-direction: column; }
            .search-btn { padding: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Stockit</h1>
        <p>Live Market Analysis • NSE Stocks</p>
    </header>

    <div class="search-container">
        <input type="text" id="symbolInput" class="search-input" placeholder="Enter NSE symbol (e.g. RELIANCE, TCS, INFY)" autocomplete="off"/>
        <button id="searchBtn" class="search-btn">
            <span id="btnText">Analyze</span>
            <span id="btnLoader" class="loader hidden"></span>
        </button>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <div id="mainContent" class="hidden">

        <!-- Company Header -->
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;">
                <div>
                    <h2 id="companyName" style="font-size:2.2rem;">—</h2>
                    <div id="companySymbol" style="color:var(--text-secondary); font-size:1.2rem;">—</div>
                </div>
                <div style="text-align:right;">
                    <div id="currentPrice" style="font-size:2.8rem; font-weight:700;">₹0.00</div>
                </div>
            </div>
            <div id="companySummary" style="margin-top:16px; color:var(--text-secondary);"></div>
        </div>

        <div class="grid">

            <!-- Price Analysis -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">📈</div>
                    <h2>Price Analysis (30 days)</h2>
                </div>
                <div class="metric-grid" id="priceMetrics"></div>
                <div class="price-chart" id="priceChart"></div>
                <div class="bar-chart" id="volumeChart" style="height:140px;"></div>
                <div class="candle-chart" id="candleChart"></div>
                <div id="priceSummary" style="margin-top:16px; font-size:0.98rem;"></div>
            </div>

            <!-- News Sentiment -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon" style="background:var(--purple-bg);">📰</div>
                    <h2>News Sentiment</h2>
                </div>
                <div class="metric-grid" id="newsMetrics"></div>
                <div class="gauge-container">
                    <div class="gauge">
                        <div class="gauge-bg"></div>
                        <div class="gauge-center"></div>
                        <div class="gauge-needle" id="sentimentNeedle"></div>
                        <div class="gauge-value" id="sentimentValue">50%</div>
                    </div>
                </div>
                <div class="bar-chart" id="sentimentChart" style="height:140px; margin:0 20px;"></div>
                <div style="margin:20px 0 10px; font-weight:600;">Recent Headlines</div>
                <div id="sentimentList" style="max-height:260px; overflow-y:auto;"></div>
            </div>

            <!-- Financials -->
            <div class="card">
                <div class="card-header">
                    <div class="card-icon" style="background:var(--yellow-bg);">💰</div>
                    <h2>Key Financials</h2>
                </div>
                <table>
                    <thead><tr><th>Metric</th><th>Value</th></tr></thead>
                    <tbody id="financialsTableBody"></tbody>
                </table>
            </div>

            <!-- Strategy -->
            <div class="card" style="grid-column:1/-1;">
                <div class="card-header">
                    <div class="card-icon" style="background:var(--green-bg);">🎯</div>
                    <h2>Strategy & Outlook</h2>
                </div>
                <div id="outcomeBoxes"></div>
                <div class="strategy-grid" id="strategyGrid"></div>
            </div>

        </div>
    </div>
</div>

<script>
    const API_BASE = "https://localhost:5000"; // free public wrapper (from search results)

    let priceData = [];
    let newsData  = { sentiment:'neutral', score:50, headlines:[] };
    let priceTrend = 'sideways';

    document.getElementById('searchBtn').onclick = async () => {
        let symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
        if (!symbol) return;

        const btn = document.getElementById('searchBtn');
        const txt = document.getElementById('btnText');
        const ldr = document.getElementById('btnLoader');
        const err = document.getElementById('errorMsg');
        const main = document.getElementById('mainContent');

        btn.disabled = true;
        txt.classList.add('hidden');
        ldr.classList.remove('hidden');
        err.classList.add('hidden');
        main.classList.add('hidden');

        try {
            // Company info
            const info = await (await fetch(`${API_BASE}/company/info?symbol=${symbol}.NS`)).json();
            if (info.error) throw new Error(info.error);

            document.getElementById('companyName').textContent   = info['longName']   || info['shortName'] || symbol;
            document.getElementById('companySymbol').textContent = info['symbol'].replace('.NS','');
            document.getElementById('currentPrice').textContent  = `₹${Number(info['regularMarketPrice']||0).toLocaleString()}`;
            document.getElementById('companySummary').textContent = info['longBusinessSummary']?.slice(0,280)+'...' || 'No summary';

            // History (≈30 days)
            const hist = await (await fetch(`${API_BASE}/company/history?symbol=${symbol}.NS&period=1mo&interval=1d`)).json();
            processPrice(hist);

            // News
            const news = await (await fetch(`${API_BASE}/company/news?symbol=${symbol}.NS`)).json();
            processNews(news || []);

            // Financials (basic)
            const fin = await (await fetch(`${API_BASE}/company/financials?symbol=${symbol}.NS`)).json();
            processFinancials(fin || {});

            generateStrategy();

            main.classList.remove('hidden');

        } catch (e) {
            err.textContent = `Error: ${e.message || 'Failed to load data'}`;
            err.style.display = 'block';
        } finally {
            btn.disabled = false;
            txt.classList.remove('hidden');
            ldr.classList.add('hidden');
        }
    };

    function processPrice(data) {
        if (!Array.isArray(data) || data.length < 5) return;

        priceData = data.map(d => ({
            date:   d.Date || d.date,
            open:   Number(d.Open),
            close:  Number(d.Close),
            high:   Number(d.High),
            low:    Number(d.Low),
            volume: Number(d.Volume)
        })).filter(d => d.close > 0);

        const closes  = priceData.map(d=>d.close);
        const volumes = priceData.map(d=>d.volume);
        const avgVol  = volumes.reduce((a,b)=>a+b,0) / volumes.length || 1;
        const spike   = Math.max(...volumes) > avgVol * 1.6;

        const ret = ((closes.at(-1) - closes[0]) / closes[0]) * 100;
        priceTrend = ret > 2 ? 'up' : ret < -2 ? 'down' : 'sideways';

        document.getElementById('priceMetrics').innerHTML = `
            <div class="metric"><div class="metric-value ${priceTrend==='up'?'positive':priceTrend==='down'?'negative':'neutral'}">${priceTrend.toUpperCase()}</div><div class="metric-label">Trend</div></div>
            <div class="metric"><div class="metric-value ${ret>=0?'positive':'negative'}">${ret.toFixed(1)}%</div><div class="metric-label">Return</div></div>
            <div class="metric"><div class="metric-value">${(avgVol/1e5).toFixed(1)} L</div><div class="metric-label">Avg Vol</div></div>
            <div class="metric"><div class="metric-value ${spike?'neutral':''}">${spike?'⚠️ YES':'NO'}</div><div class="metric-label">Spike</div></div>
        `;

        document.getElementById('priceSummary').innerHTML = `30-day ${priceTrend} trend • Current vol ${spike?'spike detected':'normal'}`;

        renderLineChart(priceData);
        renderVolumeChart(priceData, avgVol);
        renderCandleChart(priceData.slice(-12));
    }

    function renderLineChart(data) {
        const cont = document.getElementById('priceChart');
        const prices = data.map(d=>d.close);
        const min = Math.min(...prices)*0.995, max = Math.max(...prices)*1.005;
        const range = max - min;

        let pts = data.map((d,i) => {
            const x = (i/(data.length-1))*100;
            const y = 100 - ((d.close-min)/range)*100;
            return `${x},${y}`;
        }).join(' ');

        cont.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
            <polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.2" />
        </svg>`;
    }

    function renderVolumeChart(data, avg) {
        const cont = document.getElementById('volumeChart');
        const maxV = Math.max(...data.map(d=>d.volume));
        cont.innerHTML = data.map(d => {
            const h = (d.volume / maxV) * 100;
            const spike = d.volume > avg*1.6;
            return `<div class="bar-wrapper"><div class="bar" style="height:${h}%;background:${spike?'var(--yellow)':'var(--blue)'}"></div><div class="bar-label">${d.date.slice(5)}</div></div>`;
        }).join('');
    }

    function renderCandleChart(data) {
        const cont = document.getElementById('candleChart');
        const vals = data.flatMap(d=>[d.high,d.low]);
        const min = Math.min(...vals), max = Math.max(...vals), rg = max-min||1;

        cont.innerHTML = data.map(d => {
            const bull = d.close >= d.open;
            const color = bull ? 'var(--green)' : 'var(--red)';
            const wTop  = ((max - d.high)/rg)*100;
            const wHgt  = ((d.high - d.low)/rg)*100 || 1;
            const bTop  = ((max - Math.max(d.open,d.close))/rg)*100;
            const bHgt  = Math.max(((Math.abs(d.close-d.open))/rg)*100, 4);

            return `<div style="flex:1; height:100%; display:flex; flex-direction:column; align-items:center; position:relative;">
                <div style="height:${wTop}%;"></div>
                <div style="width:2px; height:${wHgt}%; background:var(--text-secondary); position:relative;">
                    <div style="position:absolute; top:${bTop - wTop}%; left:-8px; width:18px; height:${bHgt}%; background:${color}; border-radius:3px;"></div>
                </div>
            </div>`;
        }).join('');
    }

    function processNews(news) {
        const posK = ['buy','growth','profit','up','surge','strong','bullish','target','beat'];
        const negK = ['fall','loss','down','drop','weak','bearish','miss','cut','risk'];

        let score = 0;
        const items = news.slice(0,8).map(n => {
            const t = (n.title||n.text||'').toLowerCase();
            let s = 0;
            posK.forEach(k=> t.includes(k) && s++);
            negK.forEach(k=> t.includes(k) && s--);
            score += s;
            return { title: n.title||n.text||'?', link:n.link||n.url, sentiment: s>0?'positive':s<0?'negative':'neutral' };
        });

        const finalScore = Math.max(20, Math.min(80, 50 + score*6));
        const sent = finalScore>58?'positive':finalScore<42?'negative':'neutral';

        newsData = { sentiment:sent, score:Math.round(finalScore), headlines:items };

        document.getElementById('newsMetrics').innerHTML = `
            <div class="metric"><div class="metric-value"><span class="badge badge-${sent}">${sent.toUpperCase()}</span></div><div class="metric-label">Sentiment</div></div>
            <div class="metric"><div class="metric-value positive">${items.filter(i=>i.sentiment==='positive').length}</div><div class="metric-label">Positive</div></div>
            <div class="metric"><div class="metric-value negative">${items.filter(i=>i.sentiment==='negative').length}</div><div class="metric-label">Negative</div></div>
        `;

        document.getElementById('sentimentNeedle').style.transform = `rotate(${-90 + finalScore*1.8}deg)`;
        document.getElementById('sentimentValue').textContent = `${Math.round(finalScore)}%`;
        document.getElementById('sentimentValue').className = `gauge-value ${sent}`;

        document.getElementById('sentimentList').innerHTML = items.map(i=>`
            <div style="padding:10px; margin:8px 0; background:var(--bg-tertiary); border-radius:8px; border-left:4px solid var(--${i.sentiment});">
                <a href="${i.link}" target="_blank" style="color:inherit; text-decoration:none;">${i.title}</a>
            </div>
        `).join('');

        const cnts = [items.filter(i=>i.sentiment==='positive').length, items.filter(i=>i.sentiment==='neutral').length, items.filter(i=>i.sentiment==='negative').length];
        const mx = Math.max(...cnts,1);
        document.getElementById('sentimentChart').innerHTML = `
            <div class="bar-wrapper"><div class="bar" style="height:${(cnts[0]/mx)*100}%;background:var(--green)"></div><div class="bar-label">Pos</div></div>
            <div class="bar-wrapper"><div class="bar" style="height:${(cnts[1]/mx)*100}%;background:var(--yellow)"></div><div class="bar-label">Neu</div></div>
            <div class="bar-wrapper"><div class="bar" style="height:${(cnts[2]/mx)*100}%;background:var(--red)"></div><div class="bar-label">Neg</div></div>
        `;
    }

    function processFinancials(data) {
        let html = '';
        for (let [k,v] of Object.entries(data)) {
            if (!v || v==='--') continue;
            let val = typeof v==='number' ? v.toLocaleString() : v;
            if (k.toLowerCase().includes('ratio') || k.toLowerCase().includes('margin')) val += '%';
            html += `<tr><td>${k}</td><td style="font-weight:600;">${val}</td></tr>`;
        }
        document.getElementById('financialsTableBody').innerHTML = html || '<tr><td colspan="2" style="text-align:center;padding:40px;">No financial data available</td></tr>';
    }

    function generateStrategy() {
        const t = priceTrend;
        const s = newsData.sentiment;
        let outlook = 'neutral', probB=30, probR=30, probS=40;

        if (t==='up'   && s==='positive') { outlook='bullish';   probB=68; probR=12; probS=20; }
        if (t==='down' && s==='negative') { outlook='bearish';   probB=12; probR=68; probS=20; }
        if (t==='sideways')               { outlook='range';    probB=35; probR=35; probS=30; }

        document.getElementById('outcomeBoxes').innerHTML = `
            <div class="outcome-box outcome-${outlook}">
                <h3 style="margin-bottom:12px;">${outlook.toUpperCase()} Outlook</h3>
                <p>Trend: <strong>${t}</strong> • Sentiment: <strong>${s}</strong></p>
                <p>Probability → Bullish ${probB}% • Bearish ${probR}% • Sideways ${probS}%</p>
        `;

        document.getElementById('strategyGrid').innerHTML = `
            <div class="strategy-card">
                <h3>Short-term</h3>
                <ul style="list-style:none; padding-left:0; line-height:1.8;">
                    <li>${outlook==='bullish'?'Look for dips to buy':'Avoid new longs'}</li>
                    <li>Use tight stops</li>
                    <li>Watch volume confirmation</li>
                </ul>
            </div>
            <div class="strategy-card">
                <h3>Key Action</h3>
                <ul style="list-style:none; padding-left:0; line-height:1.8;">
                    <li>${outlook==='bullish'?'Accumulate on weakness':'Stay patient or hedge'}</li>
                    <li>Monitor next earnings / news</li>
                </ul>
            </div>
        `;
    }

    // Enter key support
    document.getElementById('symbolInput').onkeypress = e => { if (e.key==='Enter') document.getElementById('searchBtn').click(); };
</script>
</body>
</html>
